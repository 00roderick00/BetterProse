name: professional_prose
label: Professional and expository prose
version: "1.0"
description: Explanations, reports, recommendations, and decision documents.
criteria:
  - {id: rhetorical_fit, label: Rhetorical fit, weight: 12, question: "Does the prose fit the reader, decision, genre, and practical situation?", rating_4: "Purpose, audience, tone, level of detail, and form reinforce action.", rating_2: "Purpose is visible but audience assumptions or genre choices are uneven.", rating_0: "The response is absent, off-task, or fundamentally mismatched."}
  - {id: motive, label: "Motive, problem, or stakes", weight: 6, question: "What practical need, risk, or opportunity requires this document?", rating_4: "A concrete need and proportionate stakes generate the document.", rating_2: "A useful topic has generic or weakly integrated stakes.", rating_0: "There is no identifiable need, decision, or pressure."}
  - {id: controlling_idea, label: "Controlling idea, claim, or tension", weight: 10, question: "Is the principal explanation or recommendation specific and usable?", rating_4: "A precise conclusion or recommendation directs the whole.", rating_2: "A broad direction is visible but inconsistently sustained.", rating_0: "No controlling direction can reasonably be identified."}
  - {id: development, label: "Development and reasoning", weight: 10, question: "Does the document earn its recommendation or explanation?", rating_4: "Reasoning connects facts, constraints, tradeoffs, and implications.", rating_2: "Useful development is mixed with assertion, summary, or leaps.", rating_0: "Conclusions are merely announced or do not follow."}
  - {id: support, label: "Support, evidence, and concrete particulars", weight: 8, question: "Are operational facts and examples sufficient and usable?", rating_4: "Relevant, traceable particulars support action and verification.", rating_2: "Support is relevant but thin, abstract, or weakly integrated.", rating_0: "Material claims are unsupported, fabricated, or distorted."}
  - {id: complexity, label: "Complexity, qualification, and counterpressure", weight: 5, question: "Are tradeoffs, uncertainty, and constraints handled honestly?", rating_4: "Scope, alternatives, risks, and uncertainty are calibrated.", rating_2: "Tradeoffs appear but are tokenized or weakly integrated.", rating_0: "False certainty or concealed constraints undermine use."}
  - {id: macrostructure, label: "Macrostructure and sequence", weight: 14, question: "Can the reader find and act on information in the needed order?", rating_4: "Sequence, headings, proportion, and pacing support efficient decisions.", rating_2: "The sequence is understandable but formulaic or inconvenient.", rating_0: "The order prevents efficient comprehension or use."}
  - {id: cohesion, label: "Paragraph and section cohesion", weight: 8, question: "Does each unit perform a distinct, connected function?", rating_4: "Units are purposeful, developed, and linked through ideas.", rating_2: "Several units are overloaded, thin, or mechanically connected.", rating_0: "Paragraphing and transitions materially obstruct use."}
  - {id: sentence_craft, label: "Sentence clarity, emphasis, and rhythm", weight: 8, question: "Do sentences make actors, actions, conditions, and emphasis clear?", rating_4: "Syntax and emphasis make complex information easy to use.", rating_2: "Recurring ambiguity, choppiness, or overpacking burdens the reader.", rating_0: "Persistent syntactic confusion materially obstructs comprehension."}
  - {id: diction, label: "Diction, precision, and economy", weight: 10, question: "Are words exact, economical, and appropriate to the reader?", rating_4: "Terminology is exact and concise without losing necessary nuance.", rating_2: "Jargon, abstraction, inflation, or redundancy recurs.", rating_0: "Language materially misstates or obscures the content."}
  - {id: voice, label: "Voice, ethos, and originality of perception", weight: 4, question: "Does the document project accountable and appropriate judgment?", rating_4: "Authority is earned through candor, precision, and clear responsibility.", rating_2: "The tone is generic, inconsistent, or relies on borrowed authority.", rating_0: "False experience or promotional language replaces judgment."}
  - {id: conventions, label: "Conventions, accessibility, and presentation", weight: 5, question: "Can the intended reader access and use the finished document?", rating_4: "Relevant conventions, design, and accessibility are controlled.", rating_2: "Localized errors or inconsistencies cause repairable friction.", rating_0: "Presentation failures prevent intended use."}
