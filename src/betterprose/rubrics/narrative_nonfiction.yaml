name: narrative_nonfiction
label: Narrative nonfiction
version: "1.0"
description: Personal essays, reported narratives, profiles, and literary nonfiction.
criteria:
  - {id: rhetorical_fit, label: Rhetorical fit, weight: 7, question: "Does the narrative fit its reader, purpose, form, and situation?", rating_4: "Perspective, selection, tone, pace, and form reinforce the intended experience.", rating_2: "Purpose is visible but audience assumptions or formal choices are uneven.", rating_0: "The response is absent, off-task, or fundamentally mismatched."}
  - {id: motive, label: "Motive, problem, or stakes", weight: 9, question: "What pressure, desire, conflict, or question makes the narrative necessary?", rating_4: "Consequential pressure generates movement and proportionate stakes.", rating_2: "An interesting subject has generic or weakly sustained pressure.", rating_0: "There is a subject but no meaningful tension or need."}
  - {id: controlling_idea, label: "Controlling idea, claim, or tension", weight: 8, question: "What tension, question, or pattern gives the narrative direction?", rating_4: "A specific, developing tension organizes selection and change.", rating_2: "A broad or predictable direction is visible but inconsistently sustained.", rating_0: "No controlling direction can reasonably be identified."}
  - {id: development, label: "Development and narrative movement", weight: 8, question: "Does the narrative earn its changes and effects?", rating_4: "Scene, reflection, causation, and implication produce convincing movement.", rating_2: "Movement is mixed with summary, repetition, assertion, or gaps.", rating_0: "Effects are announced rather than developed."}
  - {id: support, label: "Concrete particulars and support", weight: 12, question: "Do selected scenes and particulars make the narrative credible and vivid?", rating_4: "Representative, precise details and scenes carry meaning without fabrication.", rating_2: "Particulars are relevant but thin, generic, repetitive, or decorative.", rating_0: "The narrative lacks grounding or misrepresents invented material as fact."}
  - {id: complexity, label: "Complexity, qualification, and counterpressure", weight: 7, question: "Does the narrative preserve ambiguity and competing pressures honestly?", rating_4: "Ambiguity, limits, alternatives, and uncertainty deepen rather than blur the piece.", rating_2: "Complexity is acknowledged but tokenized or unresolved.", rating_0: "False certainty, sentimentality, or caricature flattens the subject."}
  - {id: macrostructure, label: "Macrostructure and sequence", weight: 10, question: "Does the order create meaningful discovery, pressure, and resolution?", rating_4: "Scenes and reflections arrive in a purposeful, proportionate progression.", rating_2: "The sequence is understandable but arbitrary, delayed, or disproportionate.", rating_0: "No discernible progression supports the reader's experience."}
  - {id: cohesion, label: "Paragraph and section cohesion", weight: 7, question: "Does each unit perform a distinct role in the narrative movement?", rating_4: "Units are developed, purposeful, and connected through image, idea, or action.", rating_2: "Several units are overloaded, thin, or mechanically connected.", rating_0: "Paragraphing and transitions materially obstruct movement."}
  - {id: sentence_craft, label: "Sentence clarity, emphasis, and rhythm", weight: 12, question: "Do sentences manage perception, pace, and emphasis deliberately?", rating_4: "Syntax, emphasis, complexity, and rhythm reinforce perception and movement.", rating_2: "Recurring ambiguity, monotony, choppiness, or overpacking burdens the reader.", rating_0: "Persistent syntactic confusion materially obstructs comprehension."}
  - {id: diction, label: "Diction, precision, and economy", weight: 10, question: "Are words exact, sensory where useful, and proportionate?", rating_4: "Diction adds perception and preserves distinctions without excess.", rating_2: "Abstraction, cliché, inflation, redundancy, or imprecision recurs.", rating_0: "Language materially falsifies or obscures the experience."}
  - {id: voice, label: "Voice, ethos, and originality of perception", weight: 7, question: "Is there an accountable, non-interchangeable perceiving intelligence?", rating_4: "Stance, honesty, priorities, and original perception reinforce one another.", rating_2: "The voice is generic, inconsistent, decorative, or borrowed.", rating_0: "False experience, theatrical intimacy, or imitation replaces judgment."}
  - {id: conventions, label: "Conventions, accessibility, and presentation", weight: 3, question: "Do conventions and presentation support the intended reading experience?", rating_4: "Relevant conventions, design, and accessibility are controlled.", rating_2: "Localized errors or inconsistencies cause repairable friction.", rating_0: "Presentation failures prevent intended use or recoverable meaning."}
